[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos -2]
MouseLeaveAction=[!CommandMeasure Glass "!ReloadBlur"]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\
Ink=27,42,66
Muted=60,79,110
Blue=32,108,236
BarWidth=(#SCREENAREAWIDTH#-48)

[Glass]
Measure=Plugin
Plugin=EasyBlur
ScreenAreaWidth=#SCREENAREAWIDTH#
ScreenAreaHeight=#SCREENAREAHEIGHT#
XPos=#CURRENTCONFIGX#
YPos=#CURRENTCONFIGY#
XWidth=#BarWidth#
XHeight=40
Intensity=3
Zoom=1.08
ImagePath={{INSTALL_ROOT}}\Glass-Wallpaper-Sample.png
UpdateDivider=-1

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,( #SCREENAREAWIDTH#-48 ),40,0 | Fill Color 0,0,0,1 | StrokeWidth 0

[Mask]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 1,1,(#BarWidth#-2),(40-2),24 | Fill Color 255,255,255 | StrokeWidth 0

[Backdrop]
Group=LegacyGlass
Meter=Image
ImageName=[Glass]
DynamicVariables=1
W=#BarWidth#
H=40
Container=Mask
ImageAlpha=205

[Rim]
Group=LegacyGlass
Meter=Shape
DynamicVariables=1
Shape=Rectangle 1,1,(#BarWidth#-2),(40-2),24 | Fill LinearGradient GlassFill | Stroke LinearGradient Edge | StrokeWidth 2
Shape2=Rectangle 4,4,(#BarWidth#-8),(40-8),21 | Fill Color 0,0,0,0 | Stroke Color 255,255,255,46 | StrokeWidth 1
GlassFill=135 | 255,255,255,98 ; 0 | 245,250,255,24 ; 0.45 | 220,239,255,52 ; 1
Edge=135 | 255,255,255,245 ; 0 | 255,255,255,35 ; 0.38 | 255,255,255,30 ; 0.6 | 255,255,255,180 ; 1

[Text]
FontFace=Microsoft YaHei UI
FontColor=#Ink#
AntiAlias=1
FontSize=12

[Now]
Measure=Time
Format=%m/%d  %a  %H:%M
FormatLocale=zh-CN

[Brand]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=◈   工作台
X=22
Y=9
FontSize=12
StringStyle=Bold

[Settings]
Meter=String
DynamicVariables=1
FontFace=Segoe Fluent Icons
FontColor=#Ink#
AntiAlias=1
Text=
X=(#BarWidth#-288)
Y=8
FontSize=16
ToolTipText=设置
LeftMouseUpAction=["ms-settings:"]

[Date]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=%1
X=(#BarWidth#-22)
Y=9
FontSize=11
MeasureName=Now
StringAlign=Right
LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--panel" "calendar"]

[Bluetooth]
Meter=String
DynamicVariables=1
FontFace=Segoe Fluent Icons
FontColor=#Ink#
AntiAlias=1
Text=
X=(#BarWidth#-336)
Y=8
FontSize=16
ToolTipText=蓝牙
LeftMouseUpAction=["ms-settings:bluetooth"]

[TaskView]
Meter=String
DynamicVariables=1
FontFace=Segoe Fluent Icons
FontColor=#Ink#
AntiAlias=1
Text=
X=(#BarWidth#-384)
Y=8
FontSize=16
ToolTipText=任务视图：切换窗口与虚拟桌面
LeftMouseUpAction=["explorer.exe" "shell:::{3080F90E-D7AD-11D9-BD98-0000947B0257}"]


[GameMode]
Meter=String
DynamicVariables=1
FontFace=Segoe Fluent Icons
FontColor=#Ink#
AntiAlias=1
Text=
X=(#BarWidth#-432)
Y=8
FontSize=16
ToolTipText=游戏模式：退出美化（Ctrl+Alt+G），恢复：Ctrl+Alt+F12
LeftMouseUpAction=["{{POWERSHELL}}" "-NoProfile" "-WindowStyle" "Hidden" "-File" "{{INSTALL_ROOT}}\DesktopMode.ps1" "-Mode" "Game"]


[RefreshGlass]
Meter=String
DynamicVariables=1
FontFace=Segoe Fluent Icons
FontColor=#Ink#
AntiAlias=1
Text=
X=257
Y=8
FontSize=16
ToolTipText=重新采样：换壁纸后更新玻璃组件
LeftMouseUpAction=["{{POWERSHELL}}" "-NoProfile" "-WindowStyle" "Hidden" "-File" "{{INSTALL_ROOT}}\RefreshGlass.ps1"]
[DiskFreeBytes]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=10

[DiskFreeGB]
Measure=Calc
Formula=DiskFreeBytes / 1073741824
UpdateDivider=10

[DiskIcon]
Meter=String
DynamicVariables=1
FontFace=Segoe Fluent Icons
FontColor=#Ink#
AntiAlias=1
Text=
X=(#BarWidth#-632)
Y=8
FontSize=16
ToolTipText=C 盘存储空间
LeftMouseUpAction=["explorer.exe" "C:\"]

[DiskSpace]
Meter=String
DynamicVariables=1
MeterStyle=Text
MeasureName=DiskFreeGB
Text=C: %1 GB 可用
NumOfDecimals=1
X=(#BarWidth#-601)
Y=9
FontSize=11
ToolTipText=点击打开 C 盘
LeftMouseUpAction=["explorer.exe" "C:\"]
[LiquidState]
Measure=Script
ScriptFile=#@#LiquidGlass.lua
UpdateDivider=1


[ThemeToggle]
Meter=String
FontFace=Segoe Fluent Icons
FontColor=#Ink#
AntiAlias=1
DynamicVariables=1
Text=
X=151
Y=8
FontSize=16
ToolTipText=切换 Sky 浅色 / Astro 星空玻璃
LeftMouseUpAction=["{{POWERSHELL}}" "-NoProfile" "-WindowStyle" "Hidden" "-File" "{{INSTALL_ROOT}}\SwitchGlassTheme.ps1"]

[MotionToggle]
Meter=String
FontFace=Segoe Fluent Icons
FontColor=#Ink#
AntiAlias=1
DynamicVariables=1
Text=
X=204
Y=8
FontSize=16
ToolTipText=暂停 / 继续玻璃跟手动效
LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--toggle-motion"]
