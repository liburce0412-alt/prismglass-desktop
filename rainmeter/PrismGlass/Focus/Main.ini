[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\
Ink=27,42,66
Muted=60,79,110
Blue=32,108,236

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,244,196,0 | Fill Color 0,0,0,1 | StrokeWidth 0

[Text]
FontFace=Microsoft YaHei UI
FontColor=#Ink#
AntiAlias=1
FontSize=12


[Title]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=专注时刻
X=16
Y=17
FontSize=13

[Timer]
Measure=Script
ScriptFile=#@#Focus.lua

[Progress]
Meter=Shape
DynamicVariables=1
X=16
Y=119
Shape=Rectangle 0,0,212,4,2 | Fill Color 255,255,255,85 | StrokeWidth 0
Shape2=Rectangle 0,0,0,4,2 | Fill Color 66,133,245,210 | StrokeWidth 0

[Countdown]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=25:00
X=16
Y=43
FontSize=32

[Status]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=给自己一段不被打扰的时间
X=17
Y=96
FontSize=10

[ToggleBG]
Meter=Shape
DynamicVariables=1
X=16
Y=144
Shape=Rectangle 0,0,99,32,10 | Fill Color 255,255,255,55 | Stroke Color 255,255,255,110 | StrokeWidth 1
LeftMouseUpAction=[!CommandMeasure Timer "Toggle()"]

[Toggle]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=开始
X=26
Y=149
FontSize=11
LeftMouseUpAction=[!CommandMeasure Timer "Toggle()"]

[ResetBG]
Meter=Shape
DynamicVariables=1
X=129
Y=144
Shape=Rectangle 0,0,99,32,10 | Fill Color 255,255,255,55 | Stroke Color 255,255,255,110 | StrokeWidth 1
LeftMouseUpAction=[!CommandMeasure Timer "Reset()"]

[Reset]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=重置
X=139
Y=149
FontSize=11
LeftMouseUpAction=[!CommandMeasure Timer "Reset()"]

[FocusPreset]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=25分
X=16
Y=125
FontSize=10
LeftMouseUpAction=[!CommandMeasure Timer "Preset(25)"]

[BreakPreset]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=5分
X=68
Y=125
FontSize=10
LeftMouseUpAction=[!CommandMeasure Timer "Preset(5)"]

[ExpandToggle]
Meter=String
MeterStyle=Text
Text=⌄
FontSize=13
X=220
Y=14
DynamicVariables=1
ToolTipText=悬停展开；点击固定 / 取消固定
LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--widget" "Focus"]

[CompactSummary]
Meter=String
MeterStyle=Text
DynamicVariables=1
FontSize=9
FontColor=#Muted#
X=202
Y=21
W=90
H=18
StringAlign=Right
ClipString=1
Text=25:00

[WidgetExport]
Measure=Script
ScriptFile=#@#WidgetExport.lua
UpdateDivider=1
