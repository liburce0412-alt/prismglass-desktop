[Rainmeter]
DefaultWindowX=(#WORKAREAX#+412)
DefaultWindowY=(#WORKAREAY#+80)
DefaultAlwaysOnTop=-2
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,244,196,0 | Fill Color 0,0,0,1 | StrokeWidth 0
UpdateDivider=-1

[LegacyGlass]
Meter=Shape
Group=LegacyGlass
Shape=Rectangle .5,.5,243,195,23.5 | Fill LinearGradient Base | Stroke Color 255,255,255,90 | StrokeWidth 1
Base=120 | 112,137,209,120 ; 0 | 79,82,151,155 ; 1
UpdateDivider=-1

[Hours]
Measure=Time
Format=%H

[Minutes]
Measure=Time
Format=%M

[Date]
Measure=Time
Format=%m月%d日

[Hour]
Meter=String
MeasureName=Hours
X=66
Y=42
FontFace=Segoe UI Semibold
FontSize=51
FontColor=246,247,250
StringAlign=Center
AntiAlias=1

[Minute]
Meter=String
MeasureName=Minutes
X=178
Y=42
FontFace=Segoe UI Semibold
FontSize=51
FontColor=246,247,250
StringAlign=Center
AntiAlias=1

[Colon]
Meter=Shape
Shape=Ellipse 122,77,2.4 | Fill Color 246,247,250,210 | StrokeWidth 0
Shape2=Ellipse 122,101,2.4 | Fill Color 246,247,250,210 | StrokeWidth 0
UpdateDivider=-1

[Day]
Meter=String
MeasureName=Date
X=122
Y=162
FontFace=Microsoft YaHei UI
FontSize=10
FontColor=245,247,255,205
StringAlign=Center
AntiAlias=1

[LiquidState]
Measure=Script
ScriptFile=#@#LiquidGlass.lua

[Input]
Meter=Shape
Shape=Rectangle 4,4,236,188,21 | Fill Color 0,0,0,1 | StrokeWidth 0
ToolTipText=本机时间 · 拖动可移动
UpdateDivider=-1
