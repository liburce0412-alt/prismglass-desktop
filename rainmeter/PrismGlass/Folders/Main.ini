[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\
Ink=27,42,66
Muted=60,79,110
Blue=32,108,236

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,244,160,0 | Fill Color 0,0,0,1 | StrokeWidth 0

[Text]
FontFace=Microsoft YaHei UI
FontColor=#Ink#
AntiAlias=1
FontSize=12

[Title]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=常用位置
X=16
Y=17
FontSize=13
StringStyle=Bold

[DesktopBG]
Meter=Shape
DynamicVariables=1
X=14
Y=53
Shape=Rectangle 0,0,99,34,10 | Fill Color 255,255,255,48 | Stroke Color 255,255,255,100 | StrokeWidth 1
LeftMouseUpAction=["explorer.exe" "shell:desktop"]

[Desktop]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=桌面文件
X=22
Y=58
FontSize=11
LeftMouseUpAction=["explorer.exe" "shell:desktop"]

[DownloadBG]
Meter=Shape
DynamicVariables=1
X=129
Y=53
Shape=Rectangle 0,0,99,34,10 | Fill Color 255,255,255,48 | Stroke Color 255,255,255,100 | StrokeWidth 1
LeftMouseUpAction=["explorer.exe" "shell:Downloads"]

[Download]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=下载
X=137
Y=58
FontSize=11
LeftMouseUpAction=["explorer.exe" "shell:Downloads"]

[DocumentsBG]
Meter=Shape
DynamicVariables=1
X=14
Y=100
Shape=Rectangle 0,0,99,34,10 | Fill Color 255,255,255,48 | Stroke Color 255,255,255,100 | StrokeWidth 1
LeftMouseUpAction=["explorer.exe" "shell:Personal"]

[Documents]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=文档
X=22
Y=105
FontSize=11
LeftMouseUpAction=["explorer.exe" "shell:Personal"]

[AppsBG]
Meter=Shape
DynamicVariables=1
X=129
Y=100
Shape=Rectangle 0,0,99,34,10 | Fill Color 255,255,255,48 | Stroke Color 255,255,255,100 | StrokeWidth 1
LeftMouseUpAction=["explorer.exe" "shell:AppsFolder"]

[Apps]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=全部应用
X=137
Y=105
FontSize=11
LeftMouseUpAction=["explorer.exe" "shell:AppsFolder"]



[LiquidState]
Measure=Script
ScriptFile=#@#LiquidGlass.lua
UpdateDivider=1


[ExpandToggle]
Meter=String
MeterStyle=Text
Text=⌄
FontSize=13
X=220
Y=14
DynamicVariables=1
ToolTipText=悬停展开；点击固定 / 取消固定
LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--widget" "Folders"]
