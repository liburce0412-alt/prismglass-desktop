[Rainmeter]
DefaultWindowX=(#WORKAREAX#+144)
DefaultWindowY=(#WORKAREAY#+80)
DefaultAlwaysOnTop=-2
Update=16
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\
AmbientKind=BreathingOrb
AmbientPaused=1
AmbientIdleDivider=63
Ink=27,42,66
Muted=60,79,110
Blue=32,108,236

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,244,196,0 | Fill Color 0,0,0,1 | StrokeWidth 0
UpdateDivider=-1

[LegacyGlass]
Meter=Shape
Group=LegacyGlass
Shape=Rectangle .5,.5,243,195,23.5 | Fill LinearGradient Base | Stroke Color 255,255,255,110 | StrokeWidth 1
Base=120 | 112,137,209,120 ; 0 | 79,82,151,155 ; 1
UpdateDivider=-1

[ArtClip]
Meter=Shape
Shape=Rectangle 4,4,236,188,21 | Fill Color 255,255,255 | StrokeWidth 0
UpdateDivider=-1

[Artwork]
Meter=Image
Group=AmbientRender
ImageName=#@#AmbientArt\aurora-orb.png
Container=ArtClip
X=34
Y=12
W=176
H=176
ImageAlpha=245
PreserveAspectRatio=2
UpdateDivider=-1

[AmbientArt]
Meter=Shape
Group=AmbientRender
Container=ArtClip
Shape=Ellipse 122,100,1 | Fill Color 255,255,255,0 | StrokeWidth 0
UpdateDivider=-1

[Frame]
Meter=Shape
Group=LegacyGlass
Shape=Rectangle .5,.5,243,195,23.5 | Fill Color 0,0,0,0 | Stroke Color 255,255,255,66 | StrokeWidth 1
UpdateDivider=-1

[Ambient]
Measure=Script
ScriptFile=#@#Ambient.lua

[LiquidState]
Measure=Script
ScriptFile=#@#LiquidGlass.lua
UpdateDivider=63

; Input stays fixed while the artwork breathes, so a still pointer never enters/leaves its moving edge.
[OrbInput]
Meter=Shape
Shape=Rectangle 4,4,236,188,21 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure Ambient "Cycle()"]
MouseOverAction=[!CommandMeasure Ambient "Hover(1)"]
MouseLeaveAction=[!CommandMeasure Ambient "Hover(0)"]
ToolTipText=点击切换配色 · 拖动可移动
UpdateDivider=-1
