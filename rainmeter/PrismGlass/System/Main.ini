[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\
Ink=27,42,66
Muted=60,79,110
Blue=32,108,236

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,504,168,0 | Fill Color 0,0,0,1 | StrokeWidth 0

[Text]
FontFace=Microsoft YaHei UI
FontColor=#Ink#
AntiAlias=1
FontSize=12

[CPU]
Measure=CPU

[RAM]
Measure=PhysicalMemory

[Down]
Measure=NetIn
Interface=Best

[Up]
Measure=NetOut
Interface=Best

[Heading]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=系统性能
X=22
Y=18
FontSize=13
StringStyle=Bold
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText=打开任务管理器

[CPUText]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=CPU  %1%
X=22
Y=49
FontSize=16
MeasureName=CPU
Percentual=1

[RAMText]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=内存  %1%
X=292
Y=52
FontSize=12
MeasureName=RAM
Percentual=1

[History]
Meter=Line
DynamicVariables=1
MeasureName=CPU
X=24
Y=88
W=456
H=36
LineCount=1
LineColor=38,119,246,230
AutoScale=0
MinValue=0
MaxValue=100
AntiAlias=1
HorizontalLines=0

[Traffic]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=↓ %1B/s    ↑ %2B/s
X=22
Y=135
FontSize=10
MeasureName=Down
MeasureName2=Up
AutoScale=1
NumOfDecimals=1
FontColor=#Muted#



[ExpandToggle]
Meter=String
MeterStyle=Text
Text=⌄
FontSize=13
X=480
Y=14
DynamicVariables=1
ToolTipText=悬停展开；点击固定 / 取消固定
LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--widget" "System"]

[CompactSummary]
Meter=String
MeterStyle=Text
DynamicVariables=1
FontSize=9
FontColor=#Muted#
X=462
Y=21
W=95
H=18
StringAlign=Right
ClipString=1
Text=CPU %1%
MeasureName=CPU
Percentual=1

[WidgetExport]
Measure=Script
ScriptFile=#@#WidgetExport.lua
UpdateDivider=1
