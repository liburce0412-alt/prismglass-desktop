[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\
Ink=27,42,66
Muted=60,79,110
Blue=32,108,236

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,244,160,0 | Fill Color 0,0,0,1 | StrokeWidth 0

[Text]
FontFace=Microsoft YaHei UI
FontColor=#Ink#
AntiAlias=1
FontSize=12

[Title]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=当前曲目
X=16
Y=17
FontSize=13
StringStyle=Bold

[Badge]
Meter=Shape
DynamicVariables=1
X=16
Y=60
Shape=Rectangle 0,0,50,50,12 | Fill LinearGradient Disc | Stroke Color 255,255,255,150 | StrokeWidth 1
Disc=135 | 248,101,128,200 ; 0 | 209,73,134,140 ; 1
LeftMouseUpAction=["mswindowsmusic:"]

[Note]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=♫
X=27
Y=61
FontSize=28
FontColor=255,255,255
LeftMouseUpAction=["mswindowsmusic:"]

[Player]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=等待网易云播放
X=78
Y=56
FontSize=12
StringStyle=Bold
LeftMouseUpAction=["mswindowsmusic:"]
W=150
H=27
ClipString=1
ToolTipText=当前曲目

[PlayerHint]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=
X=78
Y=88
FontSize=10
FontColor=#Muted#
LeftMouseUpAction=["mswindowsmusic:"]
W=150
H=23
ClipString=1

[Volume]
Measure=Plugin
Plugin=Win7AudioPlugin

[VolumeText]
Meter=String
MeterStyle=Text
Text=音量 [Volume:]%
X=18
Y=130
FontSize=10
DynamicVariables=1
ToolTipText=滚动滚轮调整音量，点击打开声音设置
MouseScrollUpAction=[!CommandMeasure Volume "ChangeVolume 5"]
MouseScrollDownAction=[!CommandMeasure Volume "ChangeVolume -5"]
LeftMouseUpAction=["ms-settings:sound"]

[VolumeDown]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=−
X=163
Y=127
FontSize=16
LeftMouseUpAction=[!CommandMeasure Volume "ChangeVolume -5"]

[VolumeUp]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=+
X=202
Y=127
FontSize=16
LeftMouseUpAction=[!CommandMeasure Volume "ChangeVolume 5"]

[PlaybackMetadata]
Measure=Script
ScriptFile=#@#Music.lua

[CoverMask]
Meter=Shape
DynamicVariables=1
X=16
Y=60
Shape=Rectangle 0,0,50,50,12 | Fill Color 255,255,255 | StrokeWidth 0

[Cover]
Meter=Image
DynamicVariables=1
ImageName=
X=0
Y=0
W=50
H=50
PreserveAspectRatio=2
Container=CoverMask
Hidden=1
LeftMouseUpAction=["mswindowsmusic:"]


[ExpandToggle]
Meter=String
MeterStyle=Text
Text=⌄
FontSize=13
X=220
Y=14
DynamicVariables=1
ToolTipText=悬停展开；点击固定 / 取消固定
LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--widget" "Music"]

[CompactSummary]
Meter=String
MeterStyle=Text
DynamicVariables=1
FontSize=9
FontColor=#Muted#
X=202
Y=21
W=90
H=18
StringAlign=Right
ClipString=1
Text=等待播放

[WidgetExport]
Measure=Script
ScriptFile=#@#WidgetExport.lua
UpdateDivider=1
