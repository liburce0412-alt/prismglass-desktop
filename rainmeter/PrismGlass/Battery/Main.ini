[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\
Ink=27,42,66
Muted=60,79,110
Blue=32,108,236

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,244,196,0 | Fill Color 0,0,0,1 | StrokeWidth 0

[Text]
FontFace=Microsoft YaHei UI
FontColor=#Ink#
AntiAlias=1
FontSize=12

[Level]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[AC]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
Substitute="0":"电池供电","1":"正在连接电源","255":"电源状态未知"

[Title]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=电池
X=44
Y=18
FontSize=13
StringStyle=Bold
LeftMouseUpAction=["ms-settings:powersleep"]

[BatteryOutline]
Meter=Shape
DynamicVariables=1
X=45
Y=61
Shape=Rectangle 0,0,142,45,10 | Fill Color 255,255,255,20 | Stroke Color 28,156,107,200 | StrokeWidth 2
Shape2=Rectangle 145,15,5,15,2 | Fill Color 28,156,107,180 | StrokeWidth 0

[BatteryFill]
Meter=Bar
DynamicVariables=1
MeasureName=Level
X=51
Y=67
W=130
H=33
BarColor=54,197,140,150
BarOrientation=Horizontal

[Percent]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=%1%
X=45
Y=121
FontSize=24
MeasureName=Level

[PowerStatus]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=%1
X=45
Y=164
FontSize=10
MeasureName=AC
FontColor=#Muted#



[LiquidState]
Measure=Script
ScriptFile=#@#LiquidGlass.lua
UpdateDivider=1
