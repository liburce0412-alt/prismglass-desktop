[Rainmeter]

Update=1000

AccurateText=1

DynamicWindowSize=1

OnRefreshAction=[!Hide][!Delay 1500][!CommandMeasure Feed "Update"]


[Variables]
WeatherReady=0

LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\

Ink=27,42,66

Muted=60,79,110

Blue=32,108,236



[LiquidHitArea]

Meter=Shape

Shape=Rectangle 0,0,244,196,0 | Fill Color 0,0,0,1 | StrokeWidth 0



[Text]

FontFace=Microsoft YaHei UI

FontColor=#Ink#

AntiAlias=1

FontSize=12



[Feed]

Measure=WebParser

URL=https://api.open-meteo.com/v1/forecast?latitude={{LATITUDE}}&longitude={{LONGITUDE}}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Asia%2FShanghai&forecast_days=1

RegExp=(?si)"current":\{.*?"temperature_2m":([-\d.]+).*?"weather_code":(\d+).*?"temperature_2m_max":\[([-\d.]+)\].*?"temperature_2m_min":\[([-\d.]+)\].*?"sunrise":\["([^"]+)"\].*?"sunset":\["([^"]+)"\]

UpdateRate=900

FinishAction=[!SetVariable WeatherReady 1][!ShowMeterGroup Data][!HideMeter WeatherStatus][!UpdateMeasure WeatherLogic][!Redraw]

OnConnectErrorAction=[!SetVariable WeatherReady 0][!HideMeterGroup Data][!SetOption WeatherStatus Text "天气暂不可用"][!ShowMeter WeatherStatus][!Redraw]

OnRegExpErrorAction=[!SetVariable WeatherReady 0][!HideMeterGroup Data][!SetOption WeatherStatus Text "天气暂不可用"][!ShowMeter WeatherStatus][!Redraw]



[Temp]

Measure=WebParser

URL=[Feed]

StringIndex=1



[Code]

Measure=WebParser

URL=[Feed]

StringIndex=2



[High]

Measure=WebParser

URL=[Feed]

StringIndex=3



[Low]

Measure=WebParser

URL=[Feed]

StringIndex=4



[WeatherLogic]

Measure=Script

ScriptFile=#@#Weather.lua



[City]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=示例位置

X=20

Y=18

FontSize=14

StringStyle=Bold



[Temperature]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=%1°

X=18

Y=46

FontSize=38

MeasureName=Temp

NumOfDecimals=0

Group=Data

Hidden=1



[Condition]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=

X=21

Y=110

FontSize=12

Group=Data

Hidden=1



[Range]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=高 %1°  低 %2°

X=21

Y=143

FontSize=10

MeasureName=High

MeasureName2=Low

NumOfDecimals=0

Group=Data

Hidden=1



[WeatherStatus]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=正在获取天气…

X=20

Y=85

FontSize=11



[WeatherLink]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=↗

X=213

Y=18

FontSize=15

LeftMouseUpAction=["https://www.msn.cn/zh-cn/weather/forecast/in-示例位置,江西省"]

ToolTipText=打开天气详情







[ExpandToggle]

Meter=String

MeterStyle=Text

Text=⌄

FontSize=13

X=220

Y=14

DynamicVariables=1

ToolTipText=悬停展开；点击固定 / 取消固定

LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--widget" "Weather"]



[CompactSummary]

Meter=String

MeterStyle=Text

DynamicVariables=1

FontSize=9

FontColor=#Muted#

X=202

Y=21

W=90

H=18

StringAlign=Right

ClipString=1

Text=%1°

MeasureName=Temp

Group=Data


[WidgetExport]
Measure=Script
ScriptFile=#@#WidgetExport.lua
UpdateDivider=1

[Sunrise]
Measure=WebParser
URL=[Feed]
StringIndex=5

[Sunset]
Measure=WebParser
URL=[Feed]
StringIndex=6
