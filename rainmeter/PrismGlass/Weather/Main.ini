[Rainmeter]

Update=1000

AccurateText=1

DynamicWindowSize=1

OnRefreshAction=[!Hide][!Delay 1500][!CommandMeasure Feed "Update"]


[Variables]
WeatherReady=0

LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\

Ink=27,42,66

Muted=60,79,110

Blue=32,108,236



[LiquidHitArea]

Meter=Shape

Shape=Rectangle 0,0,244,196,0 | Fill Color 0,0,0,1 | StrokeWidth 0



; Clip the shared sky atlas inside the same 24px card contour.
[WeatherSceneMask]
Meter=Shape
X=2
Y=2
W=240
H=192
Shape=Rectangle 0,0,240,192,22 | Fill Color 255,255,255,255 | StrokeWidth 0

[WeatherEnvironment]
Meter=Image
ImageName=#LiquidRoot#weather-scenes.png
ImageCrop=0,0,627,418,1
X=0
Y=0
W=240
H=192
PreserveAspectRatio=2
Container=WeatherSceneMask
Hidden=1

[WeatherShade]
Meter=Shape
Shape=Rectangle 0,0,240,192,22 | Fill LinearGradient Shade | StrokeWidth 0
Shade=90 | 3,17,34,8 ; 0.0 | 3,17,34,105 ; 1.0
X=0
Y=0
Container=WeatherSceneMask
Hidden=1

[Text]

FontFace=Microsoft YaHei UI

FontColor=#Ink#
StringEffect=Shadow
FontEffectColor=3,17,34,125

AntiAlias=1

FontSize=12



[Feed]

Measure=WebParser

URL=https://api.open-meteo.com/v1/forecast?latitude={{LATITUDE}}&longitude={{LONGITUDE}}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=Asia%2FShanghai&forecast_days=1

RegExp=(?si)"current":\{.*?"temperature_2m":([-\d.]+).*?"weather_code":(\d+).*?"is_day":([01]).*?"temperature_2m_max":\[([-\d.]+)\].*?"temperature_2m_min":\[([-\d.]+)\].*?"sunrise":\["([^"]+)"\].*?"sunset":\["([^"]+)"\]

UpdateRate=900

FinishAction=[!SetVariable WeatherReady 1][!CommandMeasure WidgetExport "MarkWeatherUpdated()"][!ShowMeterGroup Data][!HideMeter WeatherStatus][!UpdateMeasure WeatherLogic][!Redraw]

OnConnectErrorAction=[!SetVariable WeatherReady 0][!HideMeterGroup Data][!SetOption WeatherStatus Text "天气暂不可用"][!ShowMeter WeatherStatus][!Redraw]

OnRegExpErrorAction=[!SetVariable WeatherReady 0][!HideMeterGroup Data][!SetOption WeatherStatus Text "天气暂不可用"][!ShowMeter WeatherStatus][!Redraw]



[Temp]

Measure=WebParser

URL=[Feed]

StringIndex=1



[Code]

Measure=WebParser

URL=[Feed]

StringIndex=2



[High]

Measure=WebParser

URL=[Feed]

StringIndex=4



[Low]

Measure=WebParser

URL=[Feed]

StringIndex=5



[WeatherLogic]

Measure=Script

ScriptFile=#@#Weather.lua



[City]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=示例位置

X=20

Y=18

FontSize=14

StringStyle=Bold



[Temperature]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=%1°

X=18

Y=46

FontSize=38

MeasureName=Temp

NumOfDecimals=0

Group=Data

Hidden=1



[Condition]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=

X=21

Y=110

FontSize=12

Group=Data

Hidden=1



[Range]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=高 %1°  低 %2°

X=21

Y=143

FontSize=10

MeasureName=High

MeasureName2=Low

NumOfDecimals=0

Group=Data

Hidden=1



[WeatherStatus]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=正在获取天气…

X=20

Y=85

FontSize=11



[WeatherLink]

Meter=String

DynamicVariables=1

MeterStyle=Text

Text=↗

X=213

Y=18

FontSize=15

LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--widget" "Weather"]

ToolTipText=打开天气面板与城市设置







[ExpandToggle]

Meter=String

MeterStyle=Text

Text=⌄

FontSize=13

X=220

Y=14

DynamicVariables=1

ToolTipText=悬停展开；点击固定 / 取消固定

LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--widget" "Weather"]



[CompactSummary]

Meter=String

MeterStyle=Text

DynamicVariables=1

FontSize=9

FontColor=#Muted#

X=202

Y=21

W=90

H=18

StringAlign=Right

ClipString=1

Text=%1°

MeasureName=Temp

Group=Data


[WidgetExport]
Measure=Script
ScriptFile=#@#WidgetExport.lua
UpdateDivider=1

[Sunrise]
Measure=WebParser
URL=[Feed]
StringIndex=6

[Sunset]
Measure=WebParser
URL=[Feed]
StringIndex=7

[Daylight]
Measure=WebParser
URL=[Feed]
StringIndex=3