[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\
Ink=27,42,66
Muted=60,79,110
Blue=32,108,236

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,244,196,0 | Fill Color 0,0,0,1 | StrokeWidth 0

[Text]
FontFace=Microsoft YaHei UI
FontColor=#Ink#
AntiAlias=1
FontSize=12


[Title]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=随手工具
X=16
Y=17
FontSize=13

[Hint]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=常用操作，一点即达
X=16
Y=42
FontSize=10

[CaptureBG]
Meter=Shape
DynamicVariables=1
X=14
Y=72
Shape=Rectangle 0,0,99,32,10 | Fill Color 255,255,255,55 | Stroke Color 255,255,255,110 | StrokeWidth 1
LeftMouseUpAction=["ms-screenclip:"]

[Capture]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=截图
X=23
Y=77
FontSize=11
LeftMouseUpAction=["ms-screenclip:"]

[ClipboardBG]
Meter=Shape
DynamicVariables=1
X=129
Y=72
Shape=Rectangle 0,0,99,32,10 | Fill Color 255,255,255,55 | Stroke Color 255,255,255,110 | StrokeWidth 1
LeftMouseUpAction=["{{POWERSHELL}}" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "{{INSTALL_ROOT}}\OpenClipboardHistory.ps1"]

[Clipboard]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=剪贴板历史
X=139
Y=77
FontSize=11
LeftMouseUpAction=["{{POWERSHELL}}" "-NoProfile" "-ExecutionPolicy" "Bypass" "-WindowStyle" "Hidden" "-File" "{{INSTALL_ROOT}}\OpenClipboardHistory.ps1"]

[RecycleBG]
Meter=Shape
DynamicVariables=1
X=14
Y=123
Shape=Rectangle 0,0,99,32,10 | Fill Color 255,255,255,55 | Stroke Color 255,255,255,110 | StrokeWidth 1
LeftMouseUpAction=["explorer.exe" "shell:RecycleBinFolder"]

[Recycle]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=回收站
X=23
Y=128
FontSize=11
LeftMouseUpAction=["explorer.exe" "shell:RecycleBinFolder"]

[NotesBG]
Meter=Shape
DynamicVariables=1
X=129
Y=123
Shape=Rectangle 0,0,99,32,10 | Fill Color 255,255,255,55 | Stroke Color 255,255,255,110 | StrokeWidth 1
LeftMouseUpAction=["notepad.exe" "{{INSTALL_ROOT}}\随手记.txt"]

[Notes]
Meter=String
DynamicVariables=1
MeterStyle=Text
Text=随手记
X=139
Y=128
FontSize=11
LeftMouseUpAction=["notepad.exe" "{{INSTALL_ROOT}}\随手记.txt"]

[LiquidState]
Measure=Script
ScriptFile=#@#LiquidGlass.lua
UpdateDivider=1


[ExpandToggle]
Meter=String
MeterStyle=Text
Text=⌄
FontSize=13
X=220
Y=14
DynamicVariables=1
ToolTipText=悬停展开；点击固定 / 取消固定
LeftMouseUpAction=["{{INSTALL_ROOT}}\LiquidDesktop\LiquidDesktop.exe" "--widget" "Tools"]
