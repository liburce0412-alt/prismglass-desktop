[Rainmeter]
Update=16
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos 1][!Draggable 0][!KeepOnScreen 0]
MouseLeaveAction=[!CommandMeasure Dock "Hover(0)"]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\
Ink=27,42,66
Muted=60,79,110
Blue=32,108,236
DockWidth=850

[Dock]
Measure=Script
ScriptFile=#@#Dock.lua

[LiquidState]
Measure=Script
ScriptFile=#@#LiquidGlass.lua
UpdateDivider=62

[LiquidHitArea]
Meter=Shape
UpdateDivider=-1
DynamicVariables=1
Shape=Rectangle 0,16,#DockWidth#,88,24 | Fill Color 0,0,0,1 | StrokeWidth 0

[Rim]
Group=LegacyGlass
Meter=Shape
UpdateDivider=-1
DynamicVariables=1
Shape=Rectangle 1,17,(#DockWidth#-2),86,24 | Fill Color 223,234,247,220 | Stroke Color 255,255,255,170 | StrokeWidth 1

[Divider]
Meter=Shape
UpdateDivider=-1
DynamicVariables=1
Shape=Line 0,32,0,83 | Stroke Color #Muted#,110 | StrokeWidth 1
Hidden=1

