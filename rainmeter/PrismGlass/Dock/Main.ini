UpdateDivider=-1
X=0
Y=4
Shape=Rectangle 0,0,60,96 | Fill Color 0,0,0,1 | StrokeWidth 0
Hidden=1
MouseOverAction=[!CommandMeasure Dock "Hover(1)"]

