[Rainmeter]
DefaultWindowX=(#WORKAREAX#+680)
DefaultWindowY=(#WORKAREAY#+80)
DefaultAlwaysOnTop=-2
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,244,196,0 | Fill Color 0,0,0,1 | StrokeWidth 0
UpdateDivider=-1

[LegacyGlass]
Meter=Shape
Group=LegacyGlass
Shape=Rectangle .5,.5,243,195,23.5 | Fill LinearGradient Base | Stroke Color 255,255,255,70 | StrokeWidth 1
Base=120 | 112,137,209,120 ; 0 | 79,82,151,155 ; 1
UpdateDivider=-1

[Stars]
Meter=Shape
Shape=Ellipse 42,45,1 | Fill Color 224,233,255,170 | StrokeWidth 0
Shape2=Ellipse 203,67,.7 | Fill Color 224,233,255,120 | StrokeWidth 0
Shape3=Ellipse 185,31,.65 | Fill Color 224,233,255,90 | StrokeWidth 0
UpdateDivider=-1

[MoonClip]
Meter=Shape
Shape=Ellipse 122,88,62 | Fill Color 255,255,255 | StrokeWidth 0
UpdateDivider=-1

[MoonDark]
Meter=Image
Container=MoonClip
ImageName=#@#AmbientArt\lunar-near-side.jpg
X=60
Y=26
W=124
H=124
ImageTint=108,120,151
PreserveAspectRatio=2
UpdateDivider=-1

[LitMoonClip]
Meter=Shape
Shape=Path Phase | Fill Color 255,255,255 | StrokeWidth 0
Phase=122,26 | LineTo 122,150 | LineTo 184,88 | ClosePath 1
UpdateDivider=-1

[MoonLight]
Meter=Image
Container=LitMoonClip
ImageName=#@#AmbientArt\lunar-near-side.jpg
X=60
Y=26
W=124
H=124
PreserveAspectRatio=2
UpdateDivider=-1

[PhaseLabel]
Meter=String
X=122
Y=162
Text=月相
FontFace=Microsoft YaHei UI
FontSize=10
FontColor=234,240,255,230
StringAlign=Center
AntiAlias=1
UpdateDivider=-1

[MoonState]
Measure=Script
ScriptFile=#@#Moon.lua
UpdateDivider=60

[LiquidState]
Measure=Script
ScriptFile=#@#LiquidGlass.lua

[Input]
Meter=Shape
Shape=Rectangle 4,4,236,188,21 | Fill Color 0,0,0,1 | StrokeWidth 0
ToolTipText=本地月相估算 · 北向朝上 · 拖动可移动
UpdateDivider=-1
