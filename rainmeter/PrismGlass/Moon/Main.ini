[Rainmeter]
DefaultWindowX=(#WORKAREAX#+680)
DefaultWindowY=(#WORKAREAY#+80)
DefaultAlwaysOnTop=-2
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!Hide]

[Variables]
LiquidRoot={{INSTALL_ROOT}}\LiquidDesktop\

[LiquidHitArea]
Meter=Shape
Shape=Rectangle 0,0,244,196,0 | Fill Color 0,0,0,1 | StrokeWidth 0
UpdateDivider=-1

[LegacyGlass]
Meter=Shape
Group=LegacyGlass
Shape=Rectangle .5,.5,243,195,23.5 | Fill LinearGradient Base | Stroke Color 255,255,255,70 | StrokeWidth 1
Base=120 | 235,243,255,84 ; 0 | 174,193,246,32 ; 0.38 | 175,156,225,52 ; 1
UpdateDivider=-1

[Stars]
Meter=Shape
Shape=Ellipse 42,45,1 | Fill Color 224,233,255,170 | StrokeWidth 0
Shape2=Ellipse 203,67,.7 | Fill Color 224,233,255,120 | StrokeWidth 0
Shape3=Ellipse 185,31,.65 | Fill Color 224,233,255,90 | StrokeWidth 0
UpdateDivider=-1

[MoonRim]
Meter=Shape
Shape=Ellipse 122,88,64 | Fill Color 0,0,0,0 | Stroke LinearGradient Edge | StrokeWidth .7
Edge=220 | 236,246,255,115 ; 0 | 190,214,246,15 ; .48 | 219,231,252,35 ; 1
UpdateDivider=-1

[MoonClip]
Meter=Shape
Shape=Ellipse 122,88,62 | Fill Color 255,255,255 | StrokeWidth 0
UpdateDivider=-1

[MoonDark]
Meter=Image
Container=MoonClip
ImageName=#@#AmbientArt\lunar-near-side.jpg
X=60
Y=26
W=124
H=124
ImageTint=68,81,111
PreserveAspectRatio=2
UpdateDivider=-1

[LitMoonClip]
Meter=Shape
Shape=Path Phase | Fill Color 255,255,255 | StrokeWidth 0
Phase=122,26 | LineTo 122,150 | LineTo 184,88 | ClosePath 1
UpdateDivider=-1

[MoonLight]
Meter=Image
Container=LitMoonClip
ImageName=#@#AmbientArt\lunar-near-side.jpg
X=60
Y=26
W=124
H=124
PreserveAspectRatio=2
UpdateDivider=-1

[PhaseLabel]
Meter=String
X=122
Y=162
Text=月相
FontFace=Microsoft YaHei UI
FontSize=10
FontColor=234,240,255,230
StringAlign=Center
AntiAlias=1
UpdateDivider=-1

[LunarDate]
Meter=String
X=18
Y=15
FontFace=Microsoft YaHei UI
FontSize=8
FontColor=232,241,255,160
AntiAlias=1
UpdateDivider=-1

[MoonState]
Measure=Script
ScriptFile=#@#Moon.lua
UpdateDivider=60

[LiquidState]
Measure=Script
ScriptFile=#@#LiquidGlass.lua

[Input]
Meter=Shape
Shape=Rectangle 4,4,236,188,21 | Fill Color 0,0,0,1 | StrokeWidth 0
ToolTipText=本地月相估算 · 北向朝上 · 拖动可移动
UpdateDivider=-1
