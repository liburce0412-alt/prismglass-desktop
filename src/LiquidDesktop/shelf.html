<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'"><title>PrismGlass 文件</title><link rel="stylesheet" href="shelf.css"><link rel="stylesheet" href="glass-typography.css"><link rel="stylesheet" href="prism-hint.css"></head><body>
<canvas id="glass" aria-hidden="true"></canvas><main id="shelf">
<div id="triggers"><button data-mode="quota" aria-expanded="false" aria-label="Codex 周额度尚未读取"><span class="quota-face"><svg viewBox="0 0 52 52" aria-hidden="true"><path class="quota-track" d="M10 40A21 21 0 1 1 42 40" pathLength="100"/><path class="quota-progress" d="M10 40A21 21 0 1 1 42 40" pathLength="100"/><circle cx="17" cy="45" r="1.6"/><circle cx="23" cy="47" r="1.6"/><circle cx="29" cy="47" r="1.6"/><circle cx="35" cy="45" r="1.6"/></svg><b id="quota-remaining">—</b></span><span>Codex 周额度</span></button><button data-mode="notes" aria-expanded="false"><svg data-prism-icon="notes" viewBox="0 0 24 24"><path d="M13 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path data-prism-part="pen" d="m10 14 1-4 8-8 3 3-8 8Z"/></svg><span>随手记</span></button><button data-mode="tasks" aria-expanded="false"><svg data-prism-icon="tasks" viewBox="0 0 24 24"><path data-prism-part="tick" d="m3 6 2 2 4-4"/><path d="M12 6h9M3 13h5m4 0h9M3 20h5m4 0h9"/></svg><span>待办</span></button><button data-mode="countdown" aria-expanded="false"><svg data-prism-icon="countdown" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18"/><path data-prism-part="date" d="M8 14h3v4H8Zm7 0h2m-2 4h2"/></svg><span>倒计时</span></button><button data-mode="links" aria-expanded="false"><svg data-prism-icon="links" viewBox="0 0 24 24"><path d="m9.5 14.5 5-5M8 11l-2.5 2.5a3.5 3.5 0 0 0 5 5L13 16"/><path data-prism-part="link" d="M11 8l2.5-2.5a3.5 3.5 0 0 1 5 5L16 13"/></svg><span>收藏链接</span></button><button data-mode="calculator" aria-expanded="false"><svg data-prism-icon="calculator" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M8 7h8m-8 5h1m3 0h1m3 0h0M8 16h1m3 0h1m3 0h0"/></svg><span>计算器</span></button></div>
<button id="manage-trigger" data-mode="manage" aria-expanded="false">管理</button>
<section id="panel" aria-label="桌面空间" aria-hidden="true" inert><header><div><span class="eyebrow">DESKTOP SPACE</span><h1 id="title">Codex 额度</h1></div><button id="close" aria-label="收起面板"><svg data-prism-icon="close" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header><div id="message" role="status"></div>
<div id="quota-page" class="page"><p class="intro">Codex 账户额度 · 显示剩余比例</p><div class="quota-main"><strong id="quota-week-value">—</strong><span>本周剩余</span><p id="quota-status">尚未读取额度</p></div><div class="quota-fact"><span>本周重置</span><b id="quota-week-reset">—</b></div><div class="quota-fact"><span id="quota-short-label">短期额度</span><b id="quota-short-value">未提供</b></div><div class="quota-fact"><span>短期重置</span><b id="quota-short-reset">—</b></div><button id="quota-refresh" class="primary">刷新额度</button><p id="quota-updated" class="footnote">等待读取</p><p class="footnote">每 3 分钟自动更新，也可以手动刷新。读取失败时显示上次记录。</p></div><div id="notes-page" class="page" hidden><textarea id="note-text" maxlength="32768" placeholder="记下一个想法…" aria-label="随手记内容"></textarea><button id="note-save" class="primary">保存随手记</button><p class="footnote">手动保存 · 关闭面板保留当前草稿</p></div>
<div id="tasks-page" class="page" hidden><form id="task-form"><input id="task-input" maxlength="120" placeholder="添加待办" aria-label="新事项"><button>添加</button></form><div id="tasks-list"></div><p id="tasks-empty" class="empty">暂无待办</p><p class="footnote">本机保存 · 不读取其他应用的任务</p></div>
<div id="countdown-page" class="page" hidden><div class="countdown-hero"><p id="countdown-name">尚未设置倒计时</p><strong id="countdown-days">—</strong><span id="countdown-label">设置下方的名称和日期</span></div><form id="countdown-form"><label>事件名称<input id="countdown-title" maxlength="60" placeholder="例如：假期、考试、生日" required></label><label>目标日期<input id="countdown-date" type="date" required></label><button class="primary">保存倒计时</button></form></div>
<div id="links-page" class="page" hidden><form id="link-form"><input id="link-name" maxlength="60" placeholder="名称，例如：课程资料" aria-label="链接名称" required><div><input id="link-url" type="url" maxlength="2048" placeholder="https://…" aria-label="网页地址" required><button>添加</button></div></form><div id="links-list"></div><p id="links-empty" class="empty">暂无收藏链接</p><button id="link-restore" hidden>恢复最近移除的链接</button><p class="footnote">仅保存你添加的网页 · 用默认浏览器打开</p></div>
<div id="calculator-page" class="page" hidden><form id="calculator-form"><input id="calculator-input" inputmode="decimal" maxlength="240" autocomplete="off" placeholder="例如：128 × 3 + 45" aria-label="四则运算表达式"><div id="calculator-result" role="status">0</div><div id="calculator-keys"><button type="button" data-key="clear">清空</button><button type="button" data-key="(">(</button><button type="button" data-key=")">)</button><button type="button" data-key="back">⌫</button><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="÷">÷</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="×">×</button><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="-">−</button><button type="button" data-key="0">0</button><button type="button" data-key=".">.</button><button type="button" data-key="+">+</button><button type="submit" class="primary">=</button></div></form><p class="footnote">支持小数、负数、括号与四则运算 · 回车计算</p></div>
<div id="manage-page" class="page" hidden><div class="system-links"><button data-system="computer">此电脑 ↗</button><button data-system="recycle">回收站 ↗</button><button id="browse">浏览文件</button></div><div id="manage-scroll"><section id="cursor-settings" aria-label="鼠标与拖尾设置"></section><div id="manage-list"></div></div><p class="footnote">右侧至少保留一个入口；左侧可全部隐藏。管理始终可达。</p></div>
<div id="files-page" class="page" hidden>
<nav><button id="back" title="返回">←</button><button id="up" title="上一级">↑</button><button id="home">此电脑</button><button id="pick">选择文件夹</button></nav>
<p id="path" title="此电脑">此电脑</p><label class="search"><svg data-prism-icon="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="filter" placeholder="筛选当前文件夹名称" maxlength="100" aria-label="筛选当前文件夹名称"></label>
<p id="hint">按需浏览文件夹，不进行全盘索引</p><div id="status" role="status"></div><div id="list" aria-label="文件列表"></div><button id="more" hidden>继续加载</button>
<footer><button id="explorer">在资源管理器打开 ↗</button><button id="copy">复制路径</button></footer></div></section></main>
<script src="glass-materials.js"></script><script src="glass-renderer.js"></script><script src="cursor-settings.js"></script><script src="functional-icons.js"></script><script src="prism-hint.js"></script><script src="shelf.js"></script><script src="desktop-preferences.js"></script></body></html>
