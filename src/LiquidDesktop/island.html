<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrismGlass 灵动岛</title><link rel="stylesheet" href="island.css"><link rel="stylesheet" href="glass-typography.css"></head><body>
<canvas id="glass" aria-hidden="true"></canvas><main id="island" data-mode="bar">
<div id="bar-left" class="bar-controls"><button class="brand" data-action="apps" title="应用中心">◈ 应用中心</button><button data-action="theme" title="切换 Sky / Astro" aria-label="切换主题">◐</button><button data-action="motion" title="暂停或继续动效" aria-label="暂停动效">Ⅱ</button><button data-action="refresh" title="换壁纸后点此刷新玻璃采样；不会更换系统壁纸" aria-label="更新壁纸玻璃">↻</button></div>
<button id="handle" aria-label="点击收拢为灵动岛" aria-controls="details" aria-expanded="false" title="点击收拢 · 胶囊点击或下拉展开"><span id="island-orb" aria-hidden="true"></span><span id="island-summary">桌面</span><span id="island-detail"></span><span id="wallpaper-status" role="status" hidden></span><span id="grip" aria-hidden="true"></span><progress id="island-progress" max="1" value="0" aria-label="本轮专注进度" hidden></progress></button>
<div id="bar-right" class="bar-controls"><button data-action="disk" id="disk" title="打开 C 盘">C 盘</button><button data-action="game" title="退出美化" aria-label="退出美化">⌁</button><button data-action="tasks" title="任务视图" aria-label="任务视图">▣</button><button data-action="tray" title="打开系统托盘" aria-label="打开系统托盘"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" style="vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="m5 12 5-5 5 5"/></svg></button><button data-action="bluetooth" title="蓝牙" aria-label="蓝牙设置">ᛒ</button><button data-action="settings" title="PrismGlass 设置" aria-label="PrismGlass 设置">⚙</button><button data-action="calendar" id="date">日期</button></div>
<section id="details" aria-label="灵动岛控制" inert>
<header><span id="companion-state">伴随屏未开启</span><div class="header-actions"><button data-action="companion" aria-label="打开伴随屏连接管理">管理连接</button><button data-action="companion-stop" id="companion-stop" hidden>停止远程操作</button><button id="expand-bar" title="恢复顶部整栏">整栏</button><button id="collapse" aria-label="收起控制面板">⌃</button></div></header>
<div class="cards"><article class="music"><div class="eyebrow" id="music-state">音乐</div><h2 id="music-title">等待播放</h2><p id="music-artist"></p><div class="transport"><button data-action="media-prev" aria-label="上一首">⏮</button><button data-action="media-toggle" id="media-toggle" aria-label="播放或暂停">▶</button><button data-action="media-next" aria-label="下一首">⏭</button></div></article><article class="focus"><div class="eyebrow" id="focus-label">专注时间</div><h2 id="focus-time">--:--</h2><p id="focus-state">正在读取专注状态</p><div class="transport"><button data-action="focus-toggle" id="focus-toggle">开始</button><button data-action="focus-reset" id="focus-reset">重置</button></div></article></div>
<footer><button data-action="focus-again">开始 25 分钟</button><button data-action="focus-break">休息 5 分钟</button><span id="focus-count"></span></footer>
<button id="island-weather" data-action="weather" title="查看天气与城市设置"><span id="weather-summary">天气尚未更新</span><span id="weather-meta"></span></button><div id="feedback" role="status"></div>
</section>
</main><script src="glass-renderer.js"></script><script src="island.js"></script><script src="desktop-preferences.js"></script></body></html>
