<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrismGlass 灵动岛</title><link rel="stylesheet" href="island.css"><link rel="stylesheet" href="glass-tooltip.css"><link rel="stylesheet" href="glass-typography.css"><link rel="stylesheet" href="prism-hint.css"></head><body>
<canvas id="glass" aria-hidden="true"></canvas><main id="island" data-mode="bar">
<div id="bar-left" class="bar-controls"><button class="brand" data-action="apps" data-tooltip="应用中心"><svg class="control-icon" aria-hidden="true"><use href="control-icons.svg#welcome"/></svg><span class="brand-copy">应用中心</span></button><button data-action="theme" data-tooltip="切换 Sky / Astro" aria-label="切换主题"><svg class="control-icon" aria-hidden="true"><use href="control-icons.svg#appearance"/></svg></button><button data-action="motion" data-tooltip="暂停或继续动效" aria-label="暂停动效"><svg class="control-icon" aria-hidden="true"><use id="motion-icon" href="control-icons.svg#pause"/></svg></button><button data-action="refresh" data-tooltip="换壁纸后点此刷新玻璃采样；不会更换系统壁纸" aria-label="更新壁纸玻璃"><svg class="control-icon" aria-hidden="true"><use id="refresh-icon" href="control-icons.svg#updates"/></svg></button></div>
<button id="handle" aria-label="点击收拢为灵动岛" aria-controls="details" aria-expanded="false" data-tooltip="点击收拢 · 再次点击还原 · 下拉展开控制"><span id="island-orb" aria-hidden="true"></span><img id="island-event-icon" alt="" hidden><span id="island-event-mark" aria-hidden="true" hidden></span><span id="island-summary">桌面</span><span id="island-detail"></span><span id="wallpaper-status" role="status" hidden></span><span id="grip" aria-hidden="true"></span><progress id="island-progress" max="1" value="0" aria-label="本轮专注进度" hidden></progress></button>
<div id="bar-right" class="bar-controls"><button data-action="disk" id="disk" data-tooltip="打开 C 盘">C 盘</button><button data-action="game" data-tooltip="退出美化" aria-label="退出美化"><svg class="control-icon" aria-hidden="true"><use href="control-icons.svg#exit"/></svg></button><button data-action="tasks" data-tooltip="任务视图" aria-label="任务视图"><svg class="control-icon" aria-hidden="true"><use href="control-icons.svg#taskview"/></svg></button><button data-action="tray" data-tooltip="打开系统托盘" aria-label="打开系统托盘"><svg class="control-icon" aria-hidden="true"><use href="control-icons.svg#tray"/></svg></button><button data-action="bluetooth" data-tooltip="蓝牙" aria-label="蓝牙设置"><svg class="control-icon" aria-hidden="true"><use href="control-icons.svg#bluetooth"/></svg></button><button data-action="settings" data-tooltip="PrismGlass 设置" aria-label="PrismGlass 设置"><svg class="control-icon" aria-hidden="true"><use href="control-icons.svg#settings"/></svg></button><button data-action="calendar" id="date" data-tooltip="日期与日历">日期</button></div>
<section id="details" aria-label="灵动岛控制" inert>
<header><span id="companion-state">伴随屏未开启</span><div class="header-actions"><button data-action="companion" aria-label="打开伴随屏连接管理">管理连接</button><button data-action="companion-stop" id="companion-stop" hidden>停止远程操作</button><button id="expand-bar" data-tooltip="恢复顶部整栏">整栏</button><button id="collapse" aria-label="收起控制面板">⌃</button></div></header>
<div class="cards"><article class="music"><div class="eyebrow" id="music-state">音乐</div><h2 id="music-title">等待播放</h2><p id="music-artist"></p><div class="transport"><button data-action="media-prev" aria-label="上一首"><svg class="control-icon" aria-hidden="true"><use href="control-icons.svg#previous"/></svg></button><button data-action="media-toggle" id="media-toggle" aria-label="播放或暂停"><svg class="control-icon" aria-hidden="true"><use id="media-icon" href="control-icons.svg#play"/></svg></button><button data-action="media-next" aria-label="下一首"><svg class="control-icon" aria-hidden="true"><use href="control-icons.svg#next"/></svg></button></div></article><article class="focus"><div class="eyebrow" id="focus-label">专注时间</div><h2 id="focus-time">--:--</h2><p id="focus-state">正在读取专注状态</p><div class="transport"><button data-action="focus-toggle" id="focus-toggle">开始</button><button data-action="focus-reset" id="focus-reset">重置</button></div></article></div>
<footer><button data-action="focus-again">开始 25 分钟</button><button data-action="focus-break">休息 5 分钟</button><span id="focus-count"></span></footer>
<button id="island-weather" data-action="weather" data-tooltip="查看天气与城市设置"><span id="weather-summary">天气尚未更新</span><span id="weather-meta"></span></button><div id="feedback" role="status"></div>
</section>
</main><div id="top-tooltip" class="glass-tooltip" role="tooltip" aria-hidden="true"></div><script src="glass-materials.js"></script><script src="glass-renderer.js"></script><script src="functional-icons.js"></script><script src="prism-hint.js"></script><script src="island.js"></script><script src="desktop-preferences.js"></script></body></html>
