<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PrismGlass 灵动岛</title><link rel="stylesheet" href="island.css"></head><body>
<canvas id="glass" aria-hidden="true"></canvas><main id="island" data-mode="bar">
<div id="bar-left" class="bar-controls"><span class="brand">◈ 工作台</span><button data-action="theme" title="切换 Sky / Astro" aria-label="切换主题">◐</button><button data-action="motion" title="暂停或继续动效" aria-label="暂停动效">Ⅱ</button><button data-action="refresh" title="更新壁纸玻璃" aria-label="更新壁纸玻璃">↻</button></div>
<button id="handle" aria-label="点击收拢为灵动岛" title="点击收拢 · 灵动岛可按住下拉"><span id="island-orb" aria-hidden="true"></span><span id="island-summary">工作台</span><span id="grip" aria-hidden="true"></span></button>
<div id="bar-right" class="bar-controls"><button data-action="disk" id="disk" title="打开 C 盘">C 盘</button><button data-action="game" title="退出美化" aria-label="退出美化">⌁</button><button data-action="tasks" title="任务视图" aria-label="任务视图">▣</button><button data-action="bluetooth" title="蓝牙" aria-label="蓝牙设置">ᛒ</button><button data-action="settings" title="设置" aria-label="系统设置">⚙</button><button data-action="calendar" id="date">日期</button></div>
<section id="details" aria-label="灵动岛控制" inert><header><span id="feedback" role="status">此刻</span><button id="collapse" aria-label="收起控制面板">⌃</button></header><div class="cards"><article class="music"><div class="eyebrow">正在播放</div><h2 id="music-title">等待播放</h2><p id="music-artist">开始播放后显示歌曲</p><div class="transport"><button data-action="media-prev" aria-label="上一首">⏮</button><button data-action="media-toggle" id="media-toggle" aria-label="播放或暂停">▶</button><button data-action="media-next" aria-label="下一首">⏭</button></div></article><article class="focus"><div class="eyebrow">专注时间</div><h2 id="focus-time">25:00</h2><p id="focus-state">准备开始</p><div class="transport"><button data-action="focus-toggle" id="focus-toggle">开始</button><button data-action="focus-reset">重置</button></div></article></div><footer><button data-action="focus-25">25 分钟专注</button><button data-action="focus-5">5 分钟休息</button><span>下拉展开 · 点击还原</span></footer></section>
</main><script src="glass-renderer.js"></script><script src="island.js"></script></body></html>
