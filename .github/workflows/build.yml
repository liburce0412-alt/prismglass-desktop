name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Behavior and syntax checks
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Build
        shell: pwsh
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PrismGlass-windows-x64
          path: dist/PrismGlass
